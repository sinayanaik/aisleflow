[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lda-pibt"
version = "0.1.0"
description = "Lifelong Aisle-Managed PIBT for directional and congestion-aware multi-agent pickup and delivery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["MAPF", "MAPD", "PIBT", "warehouse", "multi-agent", "robotics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "pillow>=10.0"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "pillow>=10.0"]

[project.scripts]
lda-pibt = "lda_pibt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lda_pibt = ["gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
