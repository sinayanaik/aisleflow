[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisleflow"
version = "0.1.0"
description = "SPAR: an implementation and benchmark of SPAR-PIBT, a directional and congestion-aware extension of PIBT for multi-agent pickup and delivery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["MAPF", "MAPD", "PIBT", "warehouse", "multi-agent", "robotics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "pillow>=10.0"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "pillow>=10.0"]

[project.scripts]
lda-pibt = "lda_pibt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lda_pibt = ["gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `slow` is deselected by default: it is the wide baseline sweep, which costs
# more than the rest of the suite put together and re-proves on four extra maps
# what the three core maps already prove. `pytest -m slow` runs just it,
# `pytest -m ""` runs everything.
addopts = "-q -m 'not slow'"
markers = [
  "slow: full-coverage sweeps, deselected by default (run with `pytest -m slow`)",
]
